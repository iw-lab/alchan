name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - 'build/**'  # build 폴더가 변경될 때만 호스팅 배포
      - 'firebase.json'  # 캐시/헤더 등 호스팅 설정 변경 시 배포
      - 'functions/**'  # functions 변경 시 함수 배포
      - 'storage.rules'  # storage 권한 정책 변경 시 배포
      - 'firestore.rules'  # firestore 권한 정책 변경 시 배포

  # 수동 실행 옵션
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "변경 감지를 무시하고 전부 배포(밀린 배포 복구용)"
        type: boolean
        default: false

# 🔒 배포 동시성 가드 (2026-08-11)
#   이 워크플로는 매번 `firebase deploy --only functions` 로 **117개 전체**를 배포한다.
#   연속 push 시 두 배포가 겹치면 같은 리전의 Cloud Run Admin API 쿼터(180/60초)를 나눠 쓰면서
#   "Quota exceeded" 를 서로 유발한다(실측: 로그에 276건).
#   cancel-in-progress 는 **false** 다 — 배포를 중간에 끊으면 일부 함수만 갱신된 상태로 남는다.
#   먼저 시작한 배포를 끝까지 두고, 다음 배포가 줄을 선다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Releases 생성 권한

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # ⚠️ 0 = 전체 이력. 전엔 2 였는데, 그건 "커밋 하나씩 푸시한다"는 가정이었다.
          #    커밋 여러 개를 한 번에 푸시하면 github.event.before 가 2단계보다 뒤라
          #    범위를 못 잡는다(아래 changed-files 스텝 참조).
          fetch-depth: 0

      - name: Check if build folder exists
        run: |
          if [ ! -d "build" ]; then
            echo "Error: build folder not found. Please run 'npm run build' locally first."
            exit 1
          fi

      # 배포 직전 최종 관문. ci.yml 과 이 워크플로는 서로 독립이라(needs 없음)
      # CI 가 빨간불이어도 여기까지 온다 — 그래서 "올릴 것"을 여기서 직접 본다.
      #
      # ⚠️ 여기엔 npm ci 가 없다 = node_modules 가 없다. 두 스크립트는 그 전제로 쓰였다.
      #    (한 번 어겼다: check-build-integrity 에 acorn 을 정적 import 했다가 이 스텝이
      #     ERR_MODULE_NOT_FOUND 로 죽었다. 지금은 acorn 이 있으면 문법 검사까지, 없으면
      #     참조 무결성만 하고 건너뛴다고 **출력한다**.)
      #    새 검사를 추가할 땐 반드시 node_modules 없이 돌려 보고 넣을 것 —
      #    `git archive HEAD | tar -x -C <빈 폴더>` 로 여기와 같은 조건을 만들 수 있다.
      - name: 배포 전 산출물 검사
        run: |
          # ① 커밋된 build/ 가 참조하는 청크가 실제로 다 있는가.
          #    `git add -u build` 로 커밋하면 신규 해시 파일이 빠지고, index.html 만
          #    새 해시를 가리켜 배포 직후 전원 404 가 된다. 빌드도 테스트도 못 잡는다.
          node scripts/check-build-integrity.mjs
          # ② 캐시 헤더가 의도대로 걸리는가. Hosting 은 뒤에 오는 규칙이 이겨서
          #    앞의 규칙이 조용히 무효가 된다(실측: /sw.js 가 7일 캐시되고 있었다).
          node scripts/check-hosting-headers.mjs

      - name: Deploy Hosting to Firebase
        run: |
          npm install -g firebase-tools
          # firebase-tools hosting release API가 간헐적으로 방금 finalize한 버전을
          # "current active version"으로 오인해 HTTP 400을 반환하는 버그가 있다. 이 경우
          # 콘텐츠(버전)는 이미 live에 반영된 상태이므로 무해 처리하고 다음 단계(functions 등)로
          # 진행한다. 그 외의 실패는 그대로 중단.
          set +e
          OUT=$(firebase deploy --only hosting --project inconomysu-class --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          set -e
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -q "is the current active version"; then
              echo "⚠️ hosting: 이미 동일 버전이 active(콘텐츠 반영됨) — 무해 처리하고 계속"
            else
              echo "❌ hosting 배포 실패"; exit 1
            fi
          fi

      # 🔴 이 푸시로 실제로 바뀐 파일 목록 — 아래 조건부 배포들이 전부 이 값을 본다.
      #
      #    전에는 스텝마다 `git diff HEAD~1 HEAD` 를 따로 계산했다. 그건 "커밋을 하나씩
      #    푸시한다"는 가정인데, **커밋 여러 개를 한 번에 푸시하면 조용히 배포를 건너뛴다.**
      #    2026-08-20 실측: 커밋 3개를 한 번에 올렸더니 functions/index.js 와 firestore.rules
      #    변경이 HEAD~2 에 있어서 범위 밖으로 밀렸고, 워크플로는 **초록불인데 아무것도
      #    배포되지 않았다**(새 CF 가 NOT_FOUND, 규칙은 옛 버전 그대로).
      #    조용히 건너뛰는 게 최악이다 — 실패하면 알기라도 한다.
      #
      #    그래서 푸시 범위(before..after)를 쓴다. before 를 못 믿을 때만 HEAD~1 로 내려간다
      #    (첫 푸시·force push·workflow_dispatch 는 before 가 0000… 이거나 없다).
      - name: 변경 파일 목록 계산
        id: changed
        env:
          # 이 저장소 규약대로 run 본문에 보간하지 않고 env 로 받는다.
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOY_ALL: ${{ inputs.deploy_all }}
        run: |
          BEFORE="$PUSH_BEFORE"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "ℹ️ push 범위를 못 써서 HEAD~1 로 대체(첫 푸시·force push·수동 실행)"
            BEFORE="HEAD~1"
          fi
          if [ "$DEPLOY_ALL" = "true" ]; then
            # 변경 감지를 건너뛰고 배포만 전부 돌린다.
            #   ⚠️ 아바타 시딩(avatarShopCatalog)은 **일부러 뺐다** — 이건 배포가 아니라
            #      데이터를 쓰는 작업이라, 밀린 배포를 복구하려다 같이 돌면 안 된다.
            echo "🔁 deploy_all — 변경 감지를 무시하고 functions·storage·firestore 규칙을 배포한다"
            CHANGED=$(printf '%s\n' "functions/index.js" "storage.rules" "firestore.rules")
          else
            echo "범위: ${BEFORE}..HEAD"
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
          fi
          {
            echo "files<<__EOF__"
            echo "$CHANGED"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Functions (if changed)
        env:
          DEPLOY_CHANGED_FILES: ${{ steps.changed.outputs.files }}
          SCHEDULER_AUTH_TOKEN: ${{ secrets.SCHEDULER_AUTH_TOKEN }}
          SCHEDULER_ADMIN_TOKEN: ${{ secrets.SCHEDULER_ADMIN_TOKEN }}
          AAP_SIGNING_KEY_CURRENT: ${{ secrets.AAP_SIGNING_KEY_CURRENT }}
          AAP_SIGNING_KEY_PREVIOUS: ${{ secrets.AAP_SIGNING_KEY_PREVIOUS }}
          AAP_PAIRWISE_SALT: ${{ secrets.AAP_PAIRWISE_SALT }}
        run: |
          CHANGED="$DEPLOY_CHANGED_FILES"
          echo "=== Changed files ==="
          echo "$CHANGED"
          echo "====================="
          if echo "$CHANGED" | grep -q '^functions/'; then
            echo "✅ Functions 변경 감지 - 배포 시작"
            # GitHub Secrets에서 환경변수 주입 (새 컴퓨터 배포 시 .env 누락 방지)
            # ⚠️ 시크릿을 run 본문에 보간하지 않는다 — 값에 따옴표·백틱이 섞이면 이 스텝이
            #    깨진다(Gemini WARNING). env 로 받아 셸 변수로만 쓴다.
            printf 'SCHEDULER_AUTH_TOKEN=%s\n' "$SCHEDULER_AUTH_TOKEN" > functions/.env
            # 🔐 2차 토큰(P0-F). force·백필·회수처럼 **멱등 검사를 우회하는** 조작 전용.
            #    비어 있어도 배포는 되고 정기 작업도 정상이다 — 그 조작들만 403 으로 막힌다
            #    (fail-closed). 쓰려면 GitHub Secrets 에 SCHEDULER_ADMIN_TOKEN 을 추가할 것.
            printf 'SCHEDULER_ADMIN_TOKEN=%s\n' "$SCHEDULER_ADMIN_TOKEN" >> functions/.env
            # 🧩 AAP v1 서명키(base64 PKCS8 PEM)와 pairwise salt.
            #    ⚠️ 셋 다 비어 있어도 배포는 되고 기존 기능은 멀쩡하다 — 학습앱 토큰 발급만
            #       fail-closed 로 거부된다. PREVIOUS 는 **키 회전 중복기간에만** 채운다.
            #    ⚠️ PAIRWISE_SALT 는 회전 대상이 아니다. 바꾸면 모든 위성앱의 학생 신원이
            #       통째로 갈려 앱 쪽 기록이 고아가 된다.
            printf 'AAP_SIGNING_KEY_CURRENT=%s\n' "$AAP_SIGNING_KEY_CURRENT" >> functions/.env
            printf 'AAP_SIGNING_KEY_PREVIOUS=%s\n' "$AAP_SIGNING_KEY_PREVIOUS" >> functions/.env
            printf 'AAP_PAIRWISE_SALT=%s\n' "$AAP_PAIRWISE_SALT" >> functions/.env
            echo "=== functions/.env (masked) ==="
            sed 's/=.*/=***/' functions/.env
            echo "==============================="
            cd functions && npm ci
            # ⚠️ 배포 게이트. ci.yml 의 린트는 **이 워크플로를 막지 못한다**(둘은 서로
            #    독립이라 CI 가 빨간불이어도 배포는 그대로 진행된다). 그래서 올릴 것을
            #    여기서 한 번 더 본다 — 안 그러면 린트를 켠 의미가 없다.
            npm run lint
            cd ..
            firebase deploy --only functions --project inconomysu-class --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
            rm -f functions/.env
          else
            echo "⏭️  Functions 변경 없음 - 건너뜀"
          fi

      - name: Deploy Storage Rules (if changed)
        env:
          DEPLOY_CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          CHANGED="$DEPLOY_CHANGED_FILES"
          if echo "$CHANGED" | grep -q '^storage.rules$'; then
            echo "✅ Storage rules 변경 감지 - 배포 시작"
            firebase deploy --only storage --project inconomysu-class --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          else
            echo "⏭️  Storage rules 변경 없음 - 건너뜀"
          fi

      - name: Deploy Firestore Rules (if changed)
        env:
          DEPLOY_CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          CHANGED="$DEPLOY_CHANGED_FILES"
          if echo "$CHANGED" | grep -q '^firestore.rules$'; then
            echo "✅ Firestore rules 변경 감지 - 배포 시작"
            firebase deploy --only firestore:rules --project inconomysu-class --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          else
            echo "⏭️  Firestore rules 변경 없음 - 건너뜀"
          fi

      - name: Seed Avatar Shop (if catalog changed)
        env:
          DEPLOY_CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          CHANGED="$DEPLOY_CHANGED_FILES"
          if echo "$CHANGED" | grep -qE '^(src/data/avatarShopCatalog\.js|functions/avatarShopService\.js)$'; then
            echo "✅ 아바타 카탈로그 변경 감지 - 자동 시드 시작"
            # functions 배포가 propagate 될 시간 대기
            sleep 30
            # ES module 카탈로그 → JSON으로 변환
            node --input-type=module -e "
              import('./src/data/avatarShopCatalog.js').then(m => {
                process.stdout.write(JSON.stringify(m.ALL_AVATAR_ITEMS));
              });
            " > /tmp/avatar-items.json
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/avatar-items.json','utf8')).length)")
            echo "카탈로그 항목: $COUNT개"
            # 100개씩 batch 호출 (Cloud Function 200개 제한)
            node -e "
              const items = JSON.parse(require('fs').readFileSync('/tmp/avatar-items.json','utf8'));
              const url = 'https://asia-northeast3-inconomysu-class.cloudfunctions.net/seedAvatarShopHttp?token=${{ secrets.SCHEDULER_AUTH_TOKEN }}';
              (async () => {
                let total = 0;
                for (let i = 0; i < items.length; i += 100) {
                  const batch = items.slice(i, i + 100);
                  const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({items: batch}) });
                  const data = await res.json();
                  if (!data.success) { console.error('Seed failed:', data); process.exit(1); }
                  total += data.written || 0;
                  console.log('Batch', i/100+1, ':', data.written, '개');
                }
                console.log('✅ 총', total, '개 시드 완료');
              })();
            "
            rm -f /tmp/avatar-items.json
          else
            echo "⏭️  아바타 카탈로그 변경 없음 - 시드 건너뜀"
          fi

      # GitHub Release 생성 (AppUpdateChecker가 감지)
      - name: Set version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # 멀티라인 커밋 메시지를 파일로 저장
          git log -1 --pretty=%s > /tmp/commit_subject.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## 알찬 v${{ steps.version.outputs.version }}

            ### 사용 방법
            - **웹**: [알찬 웹앱](https://inconomysu-class.web.app) 접속 (자동 최신 버전)
            - **Android**: APK 다운로드 후 설치 (별도 빌드 시 첨부)
            - **iOS**: Safari에서 웹앱 접속 → 공유 → 홈 화면에 추가

            빌드: #${{ github.run_number }} | 커밋: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
