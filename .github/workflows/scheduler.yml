name: Scheduled Tasks (Manual Only)

# 🔥 모든 자동 스케줄은 Firebase Cloud Scheduler V2로 이전 완료
# - stockPriceSchedulerV2: 5분마다 주식 가격
# - weeklyEconomySchedulerV2: 월·금 주급/월세/재산세
# - hourlySchedulerV2: 매시간 자정리셋/경제이벤트/환율
# - dividendSchedulerV2: 매월 첫 금요일 배당
# GHA는 수동 dispatch 전용으로만 유지 (강제 재지급, 회수, 백필 등)
#
# ⚠️ 2026-08-20 (P0-F) 두 가지가 바뀌었다.
#
#  1) 토큰을 **URL 에서 헤더로** 옮겼다. 쿼리스트링에 담긴 시크릿은 Cloud Logging 의 요청 URL,
#     프록시 액세스로그, 그리고 이 워크플로 로그에까지 남는다. 실제로 이 프로젝트의 스케줄러
#     토큰 3종이 한 번 유출돼 전량 폐기한 전례가 있다. 함수 쪽은 쿼리도 계속 받지만(하위호환)
#     **여기서는 더 이상 쓰지 않는다.**
#
#  2) 멱등 가드를 우회하는 조작(force·weekKey 백필·회수·마이그레이션)은 **2차 시크릿**
#     `SCHEDULER_ADMIN_TOKEN` 을 추가로 요구한다. 정기 토큰 하나가 "전국 주급 재지급"까지
#     쥐고 있던 구조를 끊는 것이 목적이다. 이 시크릿이 없으면 해당 작업은 403 으로 거부된다.
#
#  제거된 작업(끝난 일회성 마이그레이션 — 함수도 함께 삭제):
#    · recover-teachers    systemState/teacherRecovered_v1 로 완료 확인(2026-05-12)
#    · backfill-musicrooms 라이브 musicRooms 3건 전부 classCode 보유(실측)

on:
  # 수동 실행 (긴급 상황용)
  workflow_dispatch:
    inputs:
      task:
        description: '실행할 작업 (stock, reset, salary, salary-force, rent, property-tax, economic-event, all, reverse-salary-dry, reverse-salary-commit, backfill-salary-dry, backfill-salary-commit, backfill-draw-dry, backfill-draw-commit, init-classroom, migrate-store-price-down)'
        required: true
        default: 'reset'
      weekKey:
        description: 'weekKey (reverse-salary-* / salary-force 에서 사용, 예: 2026-W15) / init-classroom의 classCode 입력에도 사용 (예: 6ZVKV3)'
        required: false
        default: '2026-W15'

jobs:
  manual-tasks:
    runs-on: ubuntu-latest
    env:
      AUTH: ${{ secrets.SCHEDULER_AUTH_TOKEN }}
      ADMIN: ${{ secrets.SCHEDULER_ADMIN_TOKEN }}
      WK: ${{ github.event.inputs.weekKey }}

    steps:
      # 공용 호출기. 모든 스텝이 이걸 쓴다 — 토큰이 URL 에 들어가는 경로를 한 곳에서 막는다.
      #   call  <url> [query...]        정기 토큰만
      #   scall <url> [query...]        정기 토큰 + 관리자 토큰(+confirm=YES) — 멱등 우회 조작
      - name: Set up caller
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/call" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          URL="$1"; shift
          ARGS=(-s -w '\nHTTP_STATUS:%{http_code}' -H "x-scheduler-auth: $AUTH")
          if [ "${NEED_ADMIN:-0}" = "1" ]; then
            if [ -z "${ADMIN:-}" ]; then
              echo "❌ SCHEDULER_ADMIN_TOKEN 시크릿이 없습니다. 이 작업은 멱등 검사를 우회하므로 2차 토큰이 필요합니다."
              echo "   GitHub → Settings → Secrets → Actions 에 SCHEDULER_ADMIN_TOKEN 을 추가하세요."
              exit 1
            fi
            ARGS+=(-H "x-scheduler-admin: $ADMIN")
          fi
          QS=""
          for kv in "$@"; do QS="${QS:+$QS&}$kv"; done
          RESPONSE=$(curl "${ARGS[@]}" "${URL}${QS:+?$QS}")
          CODE=$(echo "$RESPONSE" | grep 'HTTP_STATUS:' | cut -d':' -f2)
          echo "HTTP Status: $CODE"
          echo "Response: $(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')"
          # ⚠️ 상태코드로 실패를 알린다. 종전엔 응답만 찍고 항상 0 으로 끝나서, 토큰이 틀려
          #    401/403 이 와도 워크플로가 **초록으로** 끝났다(2026-08-20 codex WARNING).
          #    "돌렸는데 아무 일도 안 일어났다"가 성공으로 보이는 게 가장 나쁜 실패다.
          case "$CODE" in
            2*) exit 0 ;;
            "") echo "❌ 응답 없음(네트워크·타임아웃)"; exit 1 ;;
            *)  echo "❌ 요청이 거부되었습니다 (HTTP $CODE)"; exit 1 ;;
          esac
          SH
          printf '#!/usr/bin/env bash\nNEED_ADMIN=1 exec "%s/bin/call" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/scall"
          chmod +x "$RUNNER_TEMP/bin/call" "$RUNNER_TEMP/bin/scall"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # ── 정기 작업의 수동 백업(멱등 가드가 그대로 살아 있다) ───────────────────────

      - name: Update stock prices
        continue-on-error: true
        if: github.event.inputs.task == 'stock' || github.event.inputs.task == 'all'
        run: call https://stockpricescheduler-j7kazbsvxq-du.a.run.app

      - name: Midnight reset
        continue-on-error: true
        if: github.event.inputs.task == 'reset' || github.event.inputs.task == 'all'
        run: call https://midnightreset-j7kazbsvxq-du.a.run.app

      # ⚠️ 파라미터 없이 부르는 게 **정상 복구 경로**다. 이미 받은 학급·학생은 멱등 마커가
      #    걸러 주므로 이월분만 지급된다. weekKey 를 붙이면 전 학급 재지급이 되니 salary-force 로 갈 것.
      - name: Weekly salary payment
        continue-on-error: true
        if: github.event.inputs.task == 'salary' || github.event.inputs.task == 'all'
        run: call https://weeklysalary-j7kazbsvxq-du.a.run.app

      - name: Property holding tax
        continue-on-error: true
        if: github.event.inputs.task == 'property-tax' || github.event.inputs.task == 'all'
        run: call https://weeklypropertytax-j7kazbsvxq-du.a.run.app

      - name: Weekly rent collection
        continue-on-error: true
        if: github.event.inputs.task == 'rent' || github.event.inputs.task == 'all'
        run: call https://weeklyrent-j7kazbsvxq-du.a.run.app

      - name: Economic event
        continue-on-error: true
        if: github.event.inputs.task == 'economic-event' || github.event.inputs.task == 'all'
        run: call https://economiceventscheduler-j7kazbsvxq-du.a.run.app

      # ── dry run (아무것도 바꾸지 않는다 — 정기 토큰만) ──────────────────────────

      - name: Backfill salary logs (dry run)
        if: github.event.inputs.task == 'backfill-salary-dry'
        run: call https://backfillsalarylogs-j7kazbsvxq-du.a.run.app dryRun=true

      - name: Backfill draw items (dry run)
        if: github.event.inputs.task == 'backfill-draw-dry'
        run: call https://backfilldrawitems-j7kazbsvxq-du.a.run.app dryRun=true

      - name: Reverse salary (dry run)
        if: github.event.inputs.task == 'reverse-salary-dry'
        run: call https://reverselastweeklysalary-j7kazbsvxq-du.a.run.app "weekKey=$WK" dryRun=true

      # ── 🔐 멱등 가드를 우회하는 조작 (SCHEDULER_ADMIN_TOKEN + confirm=YES 필요) ──

      # 💰 임의 주차를 **전 학급** 재지급한다. 학급·학생 단위 멱등 마커를 전부 무시한다.
      #    이미 지급된 주차에 쏘면 그대로 이중지급이 되고, 되돌리려면 reverse-salary 를 써야 한다.
      - name: Weekly salary force re-pay
        if: github.event.inputs.task == 'salary-force'
        run: scall https://weeklysalary-j7kazbsvxq-du.a.run.app force=true "weekKey=$WK" confirm=YES

      # 💀 학생 현금을 되가져온다.
      - name: Reverse salary (commit)
        if: github.event.inputs.task == 'reverse-salary-commit'
        run: scall https://reverselastweeklysalary-j7kazbsvxq-du.a.run.app "weekKey=$WK" dryRun=false confirm=YES

      - name: Backfill salary logs (commit)
        if: github.event.inputs.task == 'backfill-salary-commit'
        run: scall https://backfillsalarylogs-j7kazbsvxq-du.a.run.app dryRun=false confirm=YES

      - name: Backfill draw items (commit)
        if: github.event.inputs.task == 'backfill-draw-commit'
        run: scall https://backfilldrawitems-j7kazbsvxq-du.a.run.app dryRun=false confirm=YES

      # 💰 전 학급 상점가 일괄 변경
      - name: Migrate store-price-down to 25%
        if: github.event.inputs.task == 'migrate-store-price-down'
        run: scall https://asia-northeast3-inconomysu-class.cloudfunctions.net/migrateStorePriceDownManual confirm=YES

      # 🏫 학급 기본 데이터를 덮어쓴다. weekKey 입력란에 classCode 를 넣는다.
      - name: Initialize classroom defaults
        if: github.event.inputs.task == 'init-classroom'
        run: scall https://asia-northeast3-inconomysu-class.cloudfunctions.net/initializeClassroomManual "classCode=$WK" confirm=YES
