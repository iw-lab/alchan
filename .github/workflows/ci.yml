name: CI

# 배포와 분리된 검증 게이트(2026-07-19 신설).
#   과거엔 어떤 워크플로우도 테스트/빌드를 실행하지 않아, 회귀가 배포 후에야 발견됐다.
#   PR과 main push에서 유닛테스트·rules 정합성·프로덕션 빌드를 강제한다.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: functions 의존성 설치
        # ⚠️ **유닛테스트보다 먼저**여야 한다. 일부 테스트는 functions/ 모듈을 텍스트로 읽는 게
        #    아니라 진짜로 import 한다(aapToken.test.js → functions/aap/policy.js →
        #    functions/utils.js → firebase-functions). 설치가 뒤에 있으면 CI 에서만
        #    "Cannot find module 'firebase-functions/v2/https'" 로 죽는다 — 로컬은
        #    functions/node_modules 가 이미 있어 초록불이라, **CI 에서만 나는 실패**가 된다
        #    (2026-08-20 실측: functions/node_modules 를 치우고 로컬에서 동일 재현).
        #    아래 "functions 린트"가 이미 같은 설치를 하고 있었다 — 앞으로 옮긴 것뿐이라 비용은 0.
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Unit tests (vitest)
        # ⚠️ **제외 목록을 두지 않는다.** 2026-07-19 에 test-infra 이슈로 3개를 임시 제외했는데,
        #    그 이슈가 고쳐진 뒤에도 제외만 남아 CI 가 **575개**, 로컬(`npm test`)이 **636개**를
        #    돌리는 상태로 한 달을 갔다(2026-08-20 실측). 초록불이 "다 통과했다"는 뜻이 아니게 된다 —
        #    이 저장소가 이미 한 번 겪은 실패 유형이다(메모리 test_script_hid_failures).
        #    제외한 3개는 지금 전부 통과한다(`useFirestoreData.test.js` 는 아예 존재하지도 않았다).
        #    앞으로 특정 테스트를 빼야 한다면 **여기서 숨기지 말고** 그 테스트를 고치거나 지울 것.
        run: npm test

      - name: 린트 (oxlint — React 훅 규칙)
        # CRA 를 걷어내면서 린트가 통째로 사라졌다. react-scripts 가 빌드 중에
        # ESLint 를 대신 돌려 줬는데, 이 저장소엔 자체 ESLint 설정이 없어서
        # react-scripts 제거 = 린트 0 이 됐다(실측: .eslintrc 없음, eslintConfig 없음).
        # 훅 규칙 2개(rules-of-hooks·exhaustive-deps)만 error 로 되살린다 —
        # 나머지 스타일 경고는 debt 천장이 담당한다.
        run: npm run lint

      - name: Firestore rules — 중복 match 경로 검사
        run: node scripts/check-rules-dup-paths.mjs firestore.rules

      - name: Hosting 캐시 헤더 검사
        # firebase.json 은 뒤에 오는 규칙이 이긴다. 규칙을 추가하다 앞의 것을
        # 조용히 덮는 사고가 두 번 있었다(라이브 실측으로 확인). JSON 은 주석을
        # 못 담으니 "순서 지켜라"를 적어 둘 데가 없다 — 그래서 검사로 대체한다.
        run: node scripts/check-hosting-headers.mjs

      - name: 커밋된 build/ 무결성 검사
        run: node scripts/check-build-integrity.mjs

      - name: functions 린트 사각지대 검사
        # 2026-08-17 주급 전 학급 실패의 원인은 규칙이 아니라 **검사 범위**였다 —
        # scheduler-http.js 1행의 통짜 eslint-disable 이 4,096줄 돈 코드를 가렸다.
        # 린트를 켜 두는 것만으론 부족하다. 통짜 해제가 되돌아오는 것을 막는다.
        run: node scripts/check-functions-lint-coverage.mjs

      - name: functions 린트
        # 이 폴더의 린트는 꺼져 있던 게 아니라 **고장 나 있었다** — 상위 폴더의
        # CRA 잔재 `.eslintrc.json` 을 읽다가 파서를 못 찾고 exit 2 로 죽었다.
        # 게다가 index.js 1행에 `/* eslint-disable */` 가 있어 10,691줄이 통째로
        # 검사 대상 밖이었다. 결제·정산 코드가 거기 있다.
        working-directory: functions
        run: npm run lint

      - name: z-index 최상단 검사
        # 확인 모달이 다른 UI 뒤에 숨으면 에러 없이 조용히 멈춘다 — 사용자는
        # "버튼이 안 눌린다"고 느끼고, 호출부는 await 에서 안 끝난다.
        # 실제로 확인창(10001) 위에 그려지는 파일이 8개 있었다(Police.css 의
        # `.modal-container{1000000!important}` 은 12개 화면이 공유하는 클래스다).
        run: node scripts/check-zindex.mjs

      - name: 기술부채 천장 검사
        # 새 alert()·!important·직접 Firestore 접근이 늘면 실패한다.
        # 기존 671/721/51/46 은 천장으로 인정하고 **늘어나는 것만** 막는다.
        run: npm run debt

      - name: Production build (Vite)
        # CRA 시절의 CI=false 제거 — 그건 react-scripts 가 경고를 에러로 올리던 걸
        # 끄는 플래그였고 Vite 에는 그런 동작이 없다.
        #
        # ALLOW_MISSING_ENV: .env 는 gitignore 대상이라 여기 체크아웃엔 없다.
        #   vite.config.js 의 "필수 env 없으면 빌드 중단" 가드를 그대로 두면 이 스텝이
        #   **항상** 실패한다(실측 exit 1). 여기서 확인하려는 건 "코드가 컴파일 되는가"이지
        #   "배포 가능한 산출물이 나오는가"가 아니다 — 실제로 배포되는 건 로컬에서 빌드해
        #   커밋한 build/ 이고(deploy.yml), 그 가드는 그 로컬 빌드를 지킨다.
        #
        #   👉 이 빌드를 진짜 프로덕션과 동일하게 만들고 싶다면, Firebase 웹 설정 6개를
        #      리포지토리 Variables 로 넣고 아래 env 블록을 채운 뒤 이 플래그를 지우면 된다.
        #      (그 값들은 이미 배포된 번들에서 누구나 읽을 수 있는 공개 설정이다 —
        #       비밀은 Firestore 규칙과 App Check 가 지킨다)
        env:
          ALLOW_MISSING_ENV: "1"
        run: npm run build
