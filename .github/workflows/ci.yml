name: CI

# 배포와 분리된 검증 게이트(2026-07-19 신설).
#   과거엔 어떤 워크플로우도 테스트/빌드를 실행하지 않아, 회귀가 배포 후에야 발견됐다.
#   PR과 main push에서 유닛테스트·rules 정합성·프로덕션 빌드를 강제한다.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Unit tests (vitest)
        # 재무/로직 계산 테스트(자산 보호 핵심) 143개를 게이팅한다.
        # ⚠️ 격리(2026-07-19): globalCacheService/useFirestoreData/logger 테스트는 사전 존재하는
        #   test-infra 이슈(NODE_ENV=test인데 development 가정, retry fake-timer 타임아웃)로 실패 중.
        #   제품 버그 아님. Phase5 테스트 하드닝에서 고쳐 재편입 예정 — 그 전까지 CI green 유지 위해 제외.
        run: >
          npx vitest run
          --exclude '**/globalCacheService.test.js'
          --exclude '**/useFirestoreData.test.js'
          --exclude '**/logger.test.js'

      - name: 린트 (oxlint — React 훅 규칙)
        # CRA 를 걷어내면서 린트가 통째로 사라졌다. react-scripts 가 빌드 중에
        # ESLint 를 대신 돌려 줬는데, 이 저장소엔 자체 ESLint 설정이 없어서
        # react-scripts 제거 = 린트 0 이 됐다(실측: .eslintrc 없음, eslintConfig 없음).
        # 훅 규칙 2개(rules-of-hooks·exhaustive-deps)만 error 로 되살린다 —
        # 나머지 스타일 경고는 debt 천장이 담당한다.
        run: npm run lint

      - name: Firestore rules — 중복 match 경로 검사
        run: node scripts/check-rules-dup-paths.mjs firestore.rules

      - name: Hosting 캐시 헤더 검사
        # firebase.json 은 뒤에 오는 규칙이 이긴다. 규칙을 추가하다 앞의 것을
        # 조용히 덮는 사고가 두 번 있었다(라이브 실측으로 확인). JSON 은 주석을
        # 못 담으니 "순서 지켜라"를 적어 둘 데가 없다 — 그래서 검사로 대체한다.
        run: node scripts/check-hosting-headers.mjs

      - name: 커밋된 build/ 무결성 검사
        run: node scripts/check-build-integrity.mjs

      - name: 기술부채 천장 검사
        # 새 alert()·!important·직접 Firestore 접근이 늘면 실패한다.
        # 기존 671/721/51/46 은 천장으로 인정하고 **늘어나는 것만** 막는다.
        run: npm run debt

      - name: Production build (Vite)
        # CRA 시절의 CI=false 제거 — 그건 react-scripts 가 경고를 에러로 올리던 걸
        # 끄는 플래그였고 Vite 에는 그런 동작이 없다.
        #
        # ALLOW_MISSING_ENV: .env 는 gitignore 대상이라 여기 체크아웃엔 없다.
        #   vite.config.js 의 "필수 env 없으면 빌드 중단" 가드를 그대로 두면 이 스텝이
        #   **항상** 실패한다(실측 exit 1). 여기서 확인하려는 건 "코드가 컴파일 되는가"이지
        #   "배포 가능한 산출물이 나오는가"가 아니다 — 실제로 배포되는 건 로컬에서 빌드해
        #   커밋한 build/ 이고(deploy.yml), 그 가드는 그 로컬 빌드를 지킨다.
        #
        #   👉 이 빌드를 진짜 프로덕션과 동일하게 만들고 싶다면, Firebase 웹 설정 6개를
        #      리포지토리 Variables 로 넣고 아래 env 블록을 채운 뒤 이 플래그를 지우면 된다.
        #      (그 값들은 이미 배포된 번들에서 누구나 읽을 수 있는 공개 설정이다 —
        #       비밀은 Firestore 규칙과 App Check 가 지킨다)
        env:
          ALLOW_MISSING_ENV: "1"
        run: npm run build
