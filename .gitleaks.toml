# gitleaks 설정 — 이 저장소에만 적용되는 예외.
#
# 왜 필요한가: 이 저장소는 빌드 산출물(build/)을 git 에 커밋해서 배포한다.
# 그 번들 안에는 Firebase 웹 API 키가 **반드시** 들어 있다 — 클라이언트 SDK 가
# 브라우저에서 그 키로 프로젝트를 식별하기 때문이다. 즉 이건 비밀이 아니라
# 공개 식별자이고, 감추면 앱이 동작하지 않는다. 이미 라이브 번들에서 누구나 읽을 수 있다.
#
# 실제 보호는 다른 층이 한다:
#   · Firestore 규칙 (firestore.rules) — 누가 무엇을 읽고 쓸 수 있는가
#   · App Check — 정상 앱에서 온 요청인가
#   · API 키의 HTTP 리퍼러 제한 (GCP 콘솔)
#
# ⚠️ 이 예외는 **build/ 경로**에만 적용된다. 소스(src/·functions/)의 시크릿은
#    종류를 불문하고 그대로 잡힌다. 예외를 넓히면 그때부터 이 게이트의 "통과"는
#    아무 의미도 없어진다 — 아래 뮤테이션으로 그 경계를 확인했다:
#      · src 에 AIza 키 삽입      → 잡힘 ✅
#      · build 안 AWS 키 삽입     → 잡힘 ✅ (build 예외는 gcp-api-key 규칙에만 걸림)
#      · build 안 Firebase 웹 키  → 통과 ✅ (의도한 예외)

[extend]
useDefault = true

# ───────────────────────────────────────────────────────────────────────────
# 추가 규칙: 코드에 직접 박은 비밀번호·토큰
#
# 왜 필요한가 — **기본 규칙이 이 저장소의 진짜 유출을 놓쳤다**(2026-08-10 실측).
# 이력에 하드코딩된 자격증명이 3종 있었는데 gitleaks 기본 규칙이 잡은 건 1종뿐이다:
#   · `const TOKEN = '<64자 hex>'`              → 잡힘 (generic-api-key)
#   · `const TOKEN = 'my-super-secret-…'`       → **놓침** (엔트로피가 낮다)
#   · `const PASSWORD = '…'` (cron-job.org 계정) → **놓침**
# 기본 규칙은 "키처럼 생긴 고엔트로피 문자열"을 찾는다. 사람이 고른 비밀번호는
# 그렇게 안 생겼다. 그래서 **생김새가 아니라 이름**(변수명)으로 한 번 더 본다.
[[rules]]
id = "hardcoded-credential-assignment"
description = "코드에 직접 대입한 비밀번호·토큰 (저엔트로피라 기본 규칙이 놓치는 형태)"
# ⚠️ `token` 을 단독 낱말로 반드시 넣을 것. 처음엔 `auth_?token` 으로만 적었는데
#    그건 "authtoken/auth_token" 만 맞고 **맨 `const TOKEN = …` 를 못 잡는다** —
#    하필 이 저장소가 실제로 놓쳤던 바로 그 형태다(뮤테이션 C 로 확인).
regex = '''(?i)\b(?:password|passwd|secret|token|api_?key|credential)s?\b\s*[:=]\s*["']([^"'\s$]{12,})["']'''
secretGroup = 1

[[rules.allowlists]]
# 실제 비밀이 아닌 것들. 이 목록은 좁게 유지한다 — 넓히면 규칙이 무의미해진다.
regexes = [
  '''process\.env''',                                  # 환경변수에서 읽는 정상 코드
  '''(?i)REDACTED|CHANGE_?ME|YOUR_|PLACEHOLDER|EXAMPLE|<[^>]+>|\*{4,}''',
]
# 컴파일 산출물은 제외한다. 번들 안의 `token:"…"` 는 대부분 난독화된 코드이고,
# 진짜 값이 섞이면 위쪽 build/ 예외(AIza·6L 만 허용)에 걸려 기본 규칙이 잡는다.
paths = ['''^build/''']

[[rules.allowlists]]
# 2026-02-21 cron-job.org 계정(이메일+비밀번호)이 cron-setup.mjs·cron-verify.mjs 에
# 하드코딩돼 커밋됐다. 지금 두 파일은 process.env 에서 읽는다(고쳐짐).
# ⚠️ 이 예외는 **그 커밋 하나**에만 건다 — 파일 경로로 풀면 그 파일의 새 유출까지 눈이 먼다.
# ⚠️ 계정 비밀번호 자체는 코드로 못 고친다. **cron-job.org 에서 비밀번호를 바꿔야 한다**
#    (같은 비밀번호를 다른 곳에 썼다면 거기도). 저장소가 PUBLIC 이라 이미 노출된 값이다.
description = "이미 커밋된 cron-job.org 자격증명 — 비밀번호 교체는 별도 조치 필요"
commits = ["5756dbd0c381c467d6da3a0dd7ce90cc085deb4d"]

# 전역 allowlist: 저장소가 추적하지 않는 로컬 파일들.
# (gitleaks detect --no-git 로 작업트리를 훑을 때 .env·playwright 프로필이 잡힌다.
#  전부 .gitignore 대상이라 커밋될 일이 없다 — 확인함.)
[[allowlists]]
description = "추적하지 않는 로컬 파일"
paths = [
  '''^\.env''',
  '''^\.playwright-profile''',
  '''^node_modules/''',
  '''^package-lock\.json$''',
  '''^dataconnect-generated/''',
]

# build/ 안의 Firebase 웹 API 키만 예외.
#
# ⚠️ 규칙 이름을 반드시 실제 출력에서 확인할 것. 처음엔 `gcp-api-key` 로 적었다가
#    예외가 전혀 안 먹었다 — 이 키를 잡는 규칙은 `generic-api-key` 였다.
#    (`gitleaks protect --staged -v` 의 RuleID 로 확인)
#    잘못된 규칙명을 써도 gitleaks 는 조용히 넘어간다. "설정했으니 됐겠지"가 아니라
#    **숫자가 실제로 줄었는지**를 봐야 한다.
#
# targetRules 로 해당 규칙에만 한정한다 — build/ 전체를 푸는 게 아니다.
[[allowlists]]
description = "빌드 산출물의 공개 클라이언트 키 — 브라우저에 내려가야 하는 값"
targetRules = ["generic-api-key", "gcp-api-key"]
# ⚠️ paths 와 regexes 를 함께 쓰면 gitleaks 는 **둘 중 하나만 맞아도** 통과시킨다(OR).
#    그래서 regexes 를 넣는 순간 `src/` 의 AIza 키까지 풀려 버렸다(실측: ②③ 뮤테이션이
#    전부 통과 = 게이트 무용지물). AND 로 묶으려면 `condition = "AND"` 가 필요하다.
#
# 2026-08-10 추가: reCAPTCHA site key 패턴.
#   작업트리는 이미 0건이었는데 **git 이력** 스캔(gitleaks detect)은 726건을 뱉고 있었다.
#   원인은 이 regexes 목록이 `AIza…` 만 알고 있어서다 — 번들에 같이 실려 나가는
#   `REACT_APP_RECAPTCHA_SITE_KEY:"6LeG…"`(40자)가 매번 generic-api-key 로 잡혔다.
#   그래서 게이트가 상시 빨간색이었고, 그 726건의 소음 속에 **진짜 유출 2건이 묻혀
#   있었다**(test-event.mjs 의 스케줄러 토큰 — 아래 참조). 예외가 부정확해서 게이트가
#   무력해진 것이다. 넓히는 게 아니라 **정확히 아는 공개값만** 추가해서 좁게 막는다.
#
#   reCAPTCHA site key 는 비밀이 아니다 — 페이지 HTML 에 그대로 렌더된다.
#   비밀인 짝은 secret key 이고 그건 서버(GCP 콘솔)에만 있다.
condition = "AND"
paths = ['''^build/''']
regexes = [
  '''AIza[0-9A-Za-z\-_]{35}''',   # Firebase 웹 API 키 · YouTube Data API 키
  '''6L[0-9A-Za-z_-]{38}''',      # reCAPTCHA v3 site key
]

# 소스맵(`*.map`)의 난독화된 식별자.
#
# `generic-api-key` 는 "key 라는 낱말 옆의 긴 문자열"을 의심하는 휴리스틱이라,
# 소스맵 `names` 배열의 `"_key2","_iteratorNormalCompletion"` 같은 Babel 헬퍼 이름을
# 키로 오인한다(실측: 25건 전부 이 형태, 엔트로피 3.6 대).
#
# 이 예외가 안전한 이유: 소스맵에 있는 값은 그것을 만든 `.js` 번들에도 있고,
# 그 `.js` 는 AIza·6L 두 패턴 말고는 전부 그대로 검사된다(위 예외 참조).
# 즉 진짜 토큰이 번들에 섞이면 `.map` 을 풀어 줘도 `.js` 에서 잡힌다 — 뮤테이션으로 확인.
[[allowlists]]
description = "소스맵의 난독화된 식별자 — generic-api-key 휴리스틱 오탐"
targetRules = ["generic-api-key"]
paths = ['''^build/.*\.map$''']

# 이미 폐기·교체된 스케줄러 토큰 (2026-02, test-event.mjs).
#
# 무슨 일이 있었나: cron-job.org 로 경제 이벤트를 돌리려고 만든 테스트 스크립트에
# SCHEDULER_AUTH_TOKEN 을 하드코딩해 **공개 저장소**에 커밋했다(41bd97c·31e74c1 = 64자 hex,
# 이후 d9c2fe1·b3092fd = 'my-super-secret-…' — 뒤엣것은 gitleaks 가 잡지도 못했다).
# 그 토큰은 weeklySalary·weeklyRent·weeklyPropertyTax·reverseLastWeeklySalary 를 여는 열쇠고,
# 그 엔드포인트들은 invoker:"public" 이다. 즉 URL 하나로 전교생 주급을 지급/회수할 수 있었다.
#
# 2026-08-10 확인: 두 값 모두 **이미 무효**다. backfillSalaryLogs?token=…&dryRun=false 로
# (confirm 이 없으면 DB 접근 전에 400 이 나오는 경로를 골라 부작용 0 으로) 찔러보니
# 대조군과 똑같이 401 Unauthorized 였다. 그 사이에 교체된 것이다.
# 파일 자체도 649c808 에서 제거됐고, 지금 스크립트는 process.env 에서 읽는다.
#
# 그래서 이력 지문만 예외 처리한다. 경로를 지금은 존재하지 않는 파일 하나로 못박아,
# 살아있는 파일의 새 유출은 계속 잡히게 둔다.
[[allowlists]]
description = "폐기된 스케줄러 토큰 — 교체 완료 확인(401), 파일도 삭제됨"
# ⚠️ 새 규칙을 추가하면 여기 targetRules 에도 넣어야 한다 — 안 그러면 같은 값이
#    새 규칙 이름으로 다시 뜬다(실측: hardcoded-credential-assignment 로 4건 재등장).
targetRules = ["generic-api-key", "hardcoded-credential-assignment"]
paths = ['''^test-event\.mjs$''']

# 2026-01-02 프로토타입의 **목 사용자 배열**(`src/UserService.js`, 지금은 삭제됨).
# 데모 계정 3개(학생·관리자·직원)의 더미 비밀번호로, 실제 계정이 아니다.
# 값이 "YOUR_"·"EXAMPLE" 류가 아니라 위 플레이스홀더 예외에는 안 걸린다.
# (여기 값을 그대로 옮겨 적지 않는다 — 공개 저장소에 같은 문자열을 늘릴 이유가 없다.)
# 커밋 하나로만 못박는다(파일 경로로 풀지 않는다).
[[allowlists]]
description = "삭제된 프로토타입의 목 사용자 비밀번호 — 실제 계정 아님"
targetRules = ["hardcoded-credential-assignment"]
commits = ["5b046dd6e372c93e0e63c3f1c2bf668d91b6633d"]
